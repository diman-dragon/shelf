name: Release (signed AAB for Google Play)

# Runs on a version tag (v2.4.0) or by hand. Needs four repository secrets:
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64 (see store/RELEASE_CHECKLIST.md)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: The tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ "$V" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($V): versionCode would be wrong"; exit 1; fi

      - name: Check the signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KK: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see store/RELEASE_CHECKLIST.md)"; exit 1; fi
          done

      - name: Tests and lint
        run: |
          npm ci --no-audit --no-fund
          cd tests && npm ci --no-audit --no-fund && npm run lint && npm test

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode the keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew testDebugUnitTest bundleRelease --no-daemon --console=plain

      - name: Upload the bundle
        uses: actions/upload-artifact@v5
        with:
          name: audioshelf-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

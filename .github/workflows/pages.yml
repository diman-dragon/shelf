name: Site (GitHub Pages)

# Builds ./site from store/*.md and publishes it. One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Fill store/site.json (email, date, playUrl) before the first run: the build fails while placeholders remain.
on:
  push:
    branches: [ main ]
    paths: [ 'store/**', 'tools/build-site.mjs', 'LICENSE.md', 'THIRD_PARTY_NOTICES.md', 'licenses/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-site.mjs --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

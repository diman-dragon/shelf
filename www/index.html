<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090807">
  <meta name="application-name" content="AudioShelf">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>AudioShelf</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="main"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" data-nav="shelf" class="nav-item active"><span class="nav-ico" data-icon="shelf"></span><span>Библиотека</span></button>
      <button type="button" data-nav="player" class="nav-item"><span class="nav-ico" data-icon="play"></span><span>Плеер</span></button>
      <button type="button" data-nav="playlists" class="nav-item"><span class="nav-ico" data-icon="playlist"></span><span>Плейлисты</span></button>
      <button type="button" data-nav="settings" class="nav-item"><span class="nav-ico" data-icon="settings"></span><span>Настройки</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="lib/idb-keyval.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

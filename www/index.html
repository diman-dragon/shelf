<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- The app only needs its own files plus data:/blob: (covers, offline audio). No remote hosts, no eval.
       script-src keeps 'unsafe-inline' ONLY because the Capacitor Android runtime injects its bridge into index.html as an inline
       script element; the app's own code has no inline scripts/handlers any more (cover fallback is a capture listener in ui-utils.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090807">
  <meta name="application-name" content="AudioShelf">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>AudioShelf</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="main"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" data-nav="shelf" class="nav-item active"><span class="nav-ico" data-icon="shelf"></span><span>Библиотека</span></button>
      <button type="button" data-nav="player" class="nav-item"><span class="nav-ico" data-icon="play"></span><span>Плеер</span></button>
      <button type="button" data-nav="playlists" class="nav-item"><span class="nav-ico" data-icon="playlist"></span><span>Плейлисты</span></button>
      <button type="button" data-nav="settings" class="nav-item"><span class="nav-ico" data-icon="settings"></span><span>Настройки</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="lib/idb-keyval.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

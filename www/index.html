<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090807">
  <meta name="application-name" content="Аудиокниги">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Аудиокниги</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="main"></main>
    <div id="miniPlayer" class="mini-player hidden" aria-label="Текущий проигрыватель"></div>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button data-nav="shelf" class="nav-item active"><span class="nav-ico" data-icon="shelf"></span><span>Полка</span></button>
      <button data-nav="player" class="nav-item"><span class="nav-ico" data-icon="play"></span><span>Плеер</span></button>
      <button data-nav="playlists" class="nav-item"><span class="nav-ico" data-icon="playlist"></span><span>Плейлисты</span></button>
      <button data-nav="settings" class="nav-item"><span class="nav-ico" data-icon="settings"></span><span>Настройки</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="lib/idb-keyval.js"></script>
  <script src="lib/jsmediatags.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

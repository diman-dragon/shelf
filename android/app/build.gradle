apply plugin: 'com.android.application'

def media3Version = '1.4.1'

// ---- single source of truth: package.json -> versionName / versionCode (2.2.0 -> 20200) ----
def pkg = new groovy.json.JsonSlurper().parse(file("$rootDir/../package.json"))
def vParts = (pkg.version.tokenize('.') + ['0', '0', '0']).take(3).collect { (it.replaceAll(/\D.*/, '') ?: '0').toInteger() }

// ---- single source of truth: www/dsp.json -> DspConfig.java (the web player reads the same file) ----
def dspSrc = file("$rootDir/../www/dsp.json")
def dspGenDir = layout.buildDirectory.dir("generated/dsp").get().asFile
tasks.register('generateDspConfig') {
    inputs.file(dspSrc)
    outputs.dir(dspGenDir)
    doLast {
        def cfg = new groovy.json.JsonSlurper().parse(dspSrc)
        def out = new File(dspGenDir, 'com/shelf/player/DspConfig.java')
        out.parentFile.mkdirs()
        out.text = "package com.shelf.player;\n\n" +
            "/** GENERATED from www/dsp.json by app/build.gradle — do not edit. */\n" +
            "public final class DspConfig {\n" +
            "  public static final int[] BANDS = {" + cfg.bands.join(', ') + "};\n" +
            "  public static final double Q_PEAK = " + cfg.qPeak + ";\n" +
            "  public static final double HEADROOM = " + cfg.headroom + ";\n" +
            "  public static final double CEILING = " + cfg.ceiling + ";\n" +
            "}\n"
    }
}

android {
    namespace = "com.shelf.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shelf.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vParts[0] * 10000 + vParts[1] * 100 + vParts[2]
        versionName pkg.version
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main { java.srcDir dspGenDir }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Native audiobook playback (ExoPlayer + MediaSession + media notification)
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
}

tasks.named('preBuild') { dependsOn 'generateDspConfig' }

apply from: 'capacitor.build.gradle'
